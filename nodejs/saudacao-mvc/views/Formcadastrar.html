<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Formulário Produtos</title>
  <link rel="stylesheet" href="../public/stylesheets/estilo.css">
</head>
<body>
  <form action="/produtos/cadastrar" method="POST">
  <h1>Faça seu Cadastro:</h1>
    <label for="ID">ID:</label>
    <input type="text" id="ID" name="ID" required><br><br>

    <label for="Descrição">Descrição:</label>
    <input type="text" id="Descrição" name="Descrição" required><br><br>

    <label for="Quantidade">Quantidade:</label>
    <input type="number" id="Quantidade" name="Quantidade" required><br><br>

    <label for="Preço">Preço:</label>
    <input type="number" step="0.01" id="Preço" name="Preço" required><br><br>

    <button type="submit">Enviar</button>
  </form>
</body>
</html>
